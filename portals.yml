scan_history:
  recheck_after_days: 14
location_filter:
  always_allow:
  - United States
  - USA
  - Remote
  allow:
  - Remote
  - United States
  - USA
  - Cambridge
  - Boston
  - New York
  - Mountain View
  - Sunnyvale
  - Cupertino
  - San Francisco
  - Seattle
  - Redmond
  - Bellevue
  - Santa Clara
  - Pittsburgh
  - Austin
  - Los Angeles
  - San Diego
  block: []
salary_filter:
  min: 40000
  max: 0
  currency: USD
max_posting_age_days: 90
title_filter:
  positive:
  # Core intern/co-op/new-grad signals — must be present in job title
  - Intern
  - Internship
  - Co-op
  - Coop
  - Summer 2028
  - Class of 2028
  - ML Intern
  - AI Intern
  - SWE Intern
  - Engineering Intern
  # ROUND-48: Modern AI-startup entry tracks added. OpenAI/Mistral/LangChain post
  # "New Grad", "Early Career", "University Grad" as intern-track equivalents for
  # Summer 2028 grads. Without these, the scanner was killing all entries from
  # those companies' Ashby boards.
  - New Grad
  - New Graduate
  - University Grad
  - University Graduate
  - Graduating
  - Class of 2027
  - Early Career
  - Entry Level
  - Entry-Level
  # ROUND-51: Broader entry-level catch — many AI startups title roles as
  # "Software Engineer I/II/III" without "Intern" in the title. Also catches
  # "University Hire", "Student Engineer", "University Program".
  - Software Engineer
  - University
  - Student
  - 2027
  - 2028
  negative:
  - Senior
  - Staff
  - Principal
  - Director
  - Manager
  - Lead
  - Head of
  - VP
  - Junior
  # "New Grad" moved to positive (round-48) — see comment above
  - PhD
  - PhD Intern
  - Research Intern
  # "Graduate" kept negative — blocks "Graduate Engineer" generic roles but
  # "New Grad" / "University Grad" (positive) covers the entry-level intent.
  - MBA
  - Postdoc
  - Postdoctoral
  - Doctoral
  - Master
  - Master's
  - MS Intern
  - MS Research
  - MS Program
  - PhD Student
  - Grad Student
  - Master Student
  - Graduate Degree
  - Graduate Program
  - Graduate Hiring
  - PhD Required
  - PhD Candidate
  - Advanced Degree
  - Returning Professional
  - Experienced Hire
  - .NET
  - PHP
  - Ruby
  - iOS
  - Android
  - Embedded
  - Firmware
  - FPGA
  - ASIC
  - Blockchain
  - Web3
  - Crypto
  - Salesforce
  - SAP
  - Oracle EBS
  - Prop Trader
  - Quantitative Researcher
  - Quant Researcher
  - Weapons
  - Defense Contractor
  - Aerospace Defense
visa_filter:
  enabled: false
trust_filter:
  enabled: true
content_filter:
  positive:
  - Intern
  - Internship
  - Co-op
  - Coop
  - Summer 2028
  - Class of 2028
  negative: []
